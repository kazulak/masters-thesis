name: standalone-thesis-ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-and-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Record checkout and environment identity
        run: |
          set -euo pipefail
          echo "event=$GITHUB_EVENT_NAME"
          echo "event_sha=$GITHUB_SHA"
          echo "checked_out_sha=$(git rev-parse HEAD)"
          echo "checked_out_tree=$(git rev-parse 'HEAD^{tree}')"
          echo "shallow=$(git rev-parse --is-shallow-repository)"
          python --version
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/source.txt"
          for tool in cc dpu-pkg-config dpu-upmem-dpurte-clang; do
            if command -v "$tool" >/dev/null 2>&1; then
              command -v "$tool"
            else
              echo "unavailable: $tool"
            fi
          done
          git merge-base --is-ancestor c86b589d971ef241c5f42d0da33fc772dd9c2107 HEAD
          git merge-base --is-ancestor 9fdecfe0c01c769ceb5b7410e1aa2d38a089dc87 HEAD

      - name: Verify pinned submodules
        run: |
          test "$(git -C thesis/implementation/external/QuEST rev-parse HEAD)" = "9d7618d7263e3bfba433b88cf1eac0647f08fa0a"
          test "$(git -C thesis/implementation/external/SimplePIM rev-parse HEAD)" = "1d639c53532555f01e9f71d872e7712b166d6cba"
          test "$(git -C thesis/implementation/external/PID-Comm rev-parse HEAD)" = "cecc39e29e6576ced73b2041db6e357769a6531a"

      - name: Install implementation
        working-directory: thesis/implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c ci/constraints.txt -e ".[dev,path-search]"
          python -m pip check
          python -m pip freeze > "$RUNNER_TEMP/implementation-packages.txt"

      - name: Build QuEST CPU runner
        run: make -C thesis/implementation/native/quest_cpu

      - name: Build Python wheel
        working-directory: thesis/implementation
        run: |
          python -m pip wheel --no-build-isolation --no-deps --wheel-dir /tmp/quantum-bench-wheel .

      - name: Run implementation tests
        env:
          PYTEST_ADDOPTS: "-ra --junitxml=${{ runner.temp }}/masters-thesis-pytest.xml"
        run: |
          set -o pipefail
          unset UPMEM_ALLOW_PHYSICAL_HARDWARE
          make -C thesis/implementation PYTHON=python test 2>&1 | tee "$RUNNER_TEMP/implementation-tests.log"

      - name: Report actual test coverage
        if: always()
        env:
          PYTEST_XML: "${{ runner.temp }}/masters-thesis-pytest.xml"
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          def git(*args):
              r = subprocess.run(["git", *args], capture_output=True, text=True, check=False)
              return r.stdout.strip() if r.returncode == 0 else "unavailable"

          lines = [
              "## Software test coverage",
              "",
              f"Checked-out commit: `{git('rev-parse', 'HEAD')}`",
              f"Checked-out tree: `{git('rev-parse', 'HEAD^{tree}')}`",
              f"Actions event: `{os.environ.get('GITHUB_EVENT_NAME', 'unknown')}`",
              "",
          ]
          path = Path(os.environ["PYTEST_XML"])
          if not path.is_file():
              lines.append("JUnit receipt unavailable: the test step did not produce a completed receipt. Do not interpret this as passing tests.")
          else:
              root = ET.parse(path).getroot()
              cases = list(root.iter("testcase"))
              counts = Counter()
              reasons = Counter()
              for case in cases:
                  if case.find("error") is not None:
                      counts["errors"] += 1
                  elif case.find("failure") is not None:
                      counts["failed"] += 1
                  elif (skip := case.find("skipped")) is not None:
                      counts["skipped"] += 1
                      reasons[skip.attrib.get("message", "unspecified")] += 1
                  else:
                      counts["passed"] += 1
              lines += [
                  "| Total test cases | Passed | Failed | Errors | Skipped |",
                  "| ---: | ---: | ---: | ---: | ---: |",
                  f"| {len(cases)} | {counts['passed']} | {counts['failed']} | {counts['errors']} | {counts['skipped']} |",
                  "",
                  "A green generic CI run is not physical UPMEM qualification. Skipped SDK tests are not passes.",
              ]
              if reasons:
                  lines += ["", "### Skip reasons", ""]
                  for reason, count in sorted(reasons.items()):
                      reason = reason.replace("\n", " ").replace("`", "'")
                      lines.append(f"- {count}: {reason}")
          text = "\n".join(lines) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(text)
          PY

      - name: Native CPU contract tests
        run: python -m pytest thesis/implementation/native/quest_cpu/tests --junitxml="$RUNNER_TEMP/native-cpu.xml"

      - name: Run Ruff
        run: |
          python -m ruff check thesis/implementation/src thesis/implementation/tests thesis/implementation/scripts thesis/reporting tools

      - name: Verify frozen P6 audit package
        working-directory: thesis/implementation/thesis_results/upmem_cost_guided_path_v1
        run: |
          sha256sum -c SHA256SUMS
          python3 tools/test_p6_readout.py

      - name: Run software-only plan/run/verify/report smoke
        working-directory: thesis/implementation
        run: |
          set -euo pipefail
          RUN_ROOT="$RUNNER_TEMP/qbench-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$RUN_ROOT"
          make PYTHON=python plan CONFIG=configs/tn_benchmark_reset.yml OUTPUT="$RUN_ROOT/plan"
          make PYTHON=python run CONFIG=configs/tn_benchmark_reset.yml OUTPUT="$RUN_ROOT/run"
          make PYTHON=python verify INPUT="$RUN_ROOT/run"
          make PYTHON=python report INPUT="$RUN_ROOT/run" REPORT_OUTPUT="$RUN_ROOT/report"

      - name: Retain software validation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: software-validation-${{ github.sha }}
          retention-days: 90
          path: |
            ${{ runner.temp }}/masters-thesis-pytest.xml
            ${{ runner.temp }}/native-cpu.xml
            ${{ runner.temp }}/implementation-tests.log
            ${{ runner.temp }}/implementation-packages.txt
            ${{ runner.temp }}/source.txt

  evaluation-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: Install software contract dependencies
        run: |
          python -m pip install -c thesis/implementation/ci/constraints.txt -e './thesis/implementation[dev,path-search]'
          python -m pip check
          python -m pip freeze > "$RUNNER_TEMP/evaluation-packages.txt"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/source.txt"
      - name: Evaluation and release verifier regressions
        run: |
          unset UPMEM_ALLOW_PHYSICAL_HARDWARE
          python -m pytest evaluation/final_v1/tests --junitxml="$RUNNER_TEMP/final-v1.xml"
          python -m pytest evaluation/unified_v4/tests --junitxml="$RUNNER_TEMP/unified-v4.xml"
          python -m pytest tools/tests --junitxml="$RUNNER_TEMP/release-verifier.xml"
          python -m pytest thesis/implementation/thesis_results/upmem_cost_guided_path_v1/tools/test_p6_readout.py --junitxml="$RUNNER_TEMP/path-readout.xml"
      - name: Verify frozen compact evidence and published correction receipt
        run: |
          python tools/verify_release.py --repo . --output "$RUNNER_TEMP/compact-evidence.json"
          python evaluation/unified_v4/validation/reporting-20260912/verify.py > "$RUNNER_TEMP/correction-receipt.txt"
      - name: Retain evaluation validation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evaluation-validation-${{ github.sha }}
          retention-days: 90
          path: |
            ${{ runner.temp }}/*.xml
            ${{ runner.temp }}/compact-evidence.json
            ${{ runner.temp }}/correction-receipt.txt
            ${{ runner.temp }}/evaluation-packages.txt
            ${{ runner.temp }}/source.txt

  reporting:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLCONFIGDIR: /tmp/thesis-reporting-mpl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.15"
      - name: Install frozen reporting environment
        run: |
          python -m pip install -r thesis/reporting/requirements.lock
          python -m pip check
          python -m pip freeze > "$RUNNER_TEMP/reporting-packages.txt"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/source.txt"
      - name: Test and rebuild the presentation
        run: |
          set -o pipefail
          python -Werror::ResourceWarning -m unittest discover -s thesis/reporting/tests -v 2>&1 | tee "$RUNNER_TEMP/reporting-tests.log"
          python tools/check_rendering_environment.py > "$RUNNER_TEMP/rendering-environment.json"
          python -Werror::ResourceWarning thesis/reporting/build_all.py
          git diff --exit-code -- thesis/reporting/generated
          python tools/verify_release.py --repo . --output "$RUNNER_TEMP/compact-evidence.json"
      - name: Install pinned Typst and compile the review
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz -o "$RUNNER_TEMP/typst.tar.xz"
          echo "$(cat release/typst-archive.sha256)  $RUNNER_TEMP/typst.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" compile --root . thesis/reporting/review.typ "$RUNNER_TEMP/thesis-reporting-review.pdf"
      - name: Retain reporting validation and review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reporting-validation-${{ github.sha }}
          retention-days: 90
          path: |
            ${{ runner.temp }}/reporting-tests.log
            ${{ runner.temp }}/reporting-packages.txt
            ${{ runner.temp }}/rendering-environment.json
            ${{ runner.temp }}/compact-evidence.json
            ${{ runner.temp }}/source.txt
            ${{ runner.temp }}/thesis-reporting-review.pdf
